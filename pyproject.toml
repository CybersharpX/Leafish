[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leafish"
version = "0.1.0"
description = "A pure Python, asynchronous Minecraft Java Edition bot framework inspired by Mineflayer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Leafish contributors" }]
keywords = ["minecraft", "bot", "protocol", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "protolib>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "ty>=0.0.1a0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/leafish/leafish"

[tool.hatch.build.targets.wheel]
packages = ["src/leafish"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B", "SIM", "RUF"]
ignore = ["E501", "ASYNC109"]

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
source = ["src/leafish"]
omit = ["src/leafish/data/*"]
